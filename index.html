<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Games</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 32px 20px;
    background: radial-gradient(circle at 50% 0%, #1b1f4b, #05060d 70%);
    color: #e8ecff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { width: min(720px, 100%); }
  h1 { margin: 0 0 6px; font-size: clamp(28px, 6vw, 46px); letter-spacing: 0.02em; }
  p.sub { margin: 0 0 28px; color: rgba(200, 214, 255, 0.62); }
  a.card {
    display: block;
    padding: 20px 22px;
    border: 1px solid rgba(130, 156, 230, 0.28);
    border-radius: 16px;
    background: rgba(10, 13, 28, 0.7);
    color: inherit;
    text-decoration: none;
    transition: transform 140ms ease, border-color 140ms ease;
  }
  a.card:hover { transform: translateY(-2px); border-color: rgba(126, 224, 138, 0.7); }
  a.card h2 { margin: 0 0 6px; font-size: 22px; }
  a.card span { color: rgba(200, 214, 255, 0.62); font-size: 14px; }
  .tag {
    display: inline-block;
    margin-top: 12px;
    padding: 3px 10px;
    border-radius: 99px;
    background: rgba(126, 224, 138, 0.14);
    color: #7ee08a;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
  }
</style>
</head>
<body>
<main>
  <h1>Games</h1>
  <p class="sub">Small browser games. No installs, no build steps — just open and play.</p>
  <a class="card" href="froggy-pursuit/index.html">
    <h2>🐸 Froggy Pursuit</h2>
    <span>Endless highway escape — swerve through traffic, shake the police, keep the heat bar down.</span>
    <div class="tag">ARCADE · RACING</div>
  </a>
</main>
</body>
</html>
